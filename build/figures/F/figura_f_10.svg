  <g id="text_21">
   <text style="font-weight: 700; font-size: 16px; font-family: 'Noto Sans'; text-anchor: start; fill: #3c3c3b" x="72.576" y="233.28" transform="rotate(-0 72.576 233.28)">VIOLENCIA DIGITAL</text>
  </g>
  <g id="text_22">
   <text style="font-size: 11.5px; font-family: 'Noto Sans'; fill: #222222" transform="translate(72.576 279.668241)">La percepción de mayor riesgo</text>
   <text style="font-size: 11.5px; font-family: 'Noto Sans'; fill: #222222" transform="translate(72.576 301.43023)">se concentra en niños, niñas y</text>
   <text style="font-size: 11.5px; font-family: 'Noto Sans'; fill: #222222" transform="translate(72.576 323.96218)">adolescentes (56.3%). Los</text>
   <text style="font-size: 11.5px; font-family: 'Noto Sans'; fill: #222222" transform="translate(72.576 345.4187)">porcentajes se calcularon con</text>
   <text style="font-size: 11.5px; font-family: 'Noto Sans'; fill: #222222" transform="translate(72.576 367.381041)">el factor de expansión</text>
   <text style="font-size: 11.5px; font-family: 'Noto Sans'; fill: #222222" transform="translate(72.576 389.2751)">normalizado entre personas</text>
   <text style="font-size: 11.5px; font-family: 'Noto Sans'; fill: #222222" transform="translate(72.576 411.23205)">usuarias de Internet fijo.</text>
  </g>
