[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anuario-estadistico-2026"
version = "0.24.0"
description = "Pipeline reproducible para generar el Anuario Estadístico 2026"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "Jinja2>=3.1,<4",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.1,<3",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
mapas = ["geopandas>=0.14,<2", "shapely>=2,<3"]
playwright = ["playwright>=1.47,<2"]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
anuario-2026 = "anuario2026.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
